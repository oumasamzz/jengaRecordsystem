<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenga Africa | Reports</title>
    <style>
        :root { --main: #FF9966; --grad: linear-gradient(135deg, #FF9966 0%, #CC66FF 100%); }
        body { background: #121212; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
        h1 { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .admin-box { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px dashed #444; max-width: 1000px; margin: 20px auto; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; text-align: center; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border: 1px solid #FF9966; }
        
        .btn { background: var(--grad); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        input { padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; }
        .del-btn { position: absolute; top: 10px; right: 10px; color: #ff4d4d; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>Annual <span>Reports</span></h1>
    <button onclick="toggleAdmin()" style="background:none; border:1px solid #444; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Admin</button>
</div>

<div id="admin-box" class="admin-box">
    <input type="text" id="up-title" placeholder="Report Title">
    <input type="number" id="up-year" value="2026">
    <input type="file" id="up-file">
    <button class="btn" onclick="uploadReport()">Upload to ImageKit</button>
</div>

<div class="grid" id="report-grid"></div>

<script>
    function toggleAdmin() {
        const box = document.getElementById('admin-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function loadReports() {
        const res = await fetch('/api/reports');
        const data = await res.json();
        const grid = document.getElementById('report-grid');
        grid.innerHTML = '';

        data.forEach(r => {
            grid.innerHTML += `
                <div class="card">
                    <button class="del-btn" onclick="deleteReport('${r.id}')">✕</button>
                    <div style="font-size:40px; margin-bottom:10px;">📄</div>
                    <h3>${r.title}</h3>
                    <p style="color:#888">${r.year}</p>
                    <a href="${r.url}" target="_blank" class="btn">View PDF</a>
                </div>
            `;
        });
    }

    async function uploadReport() {
        const file = document.getElementById('up-file').files[0];
        const title = document.getElementById('up-title').value;
        const year = document.getElementById('up-year').value;

        if(!file || !title) return alert("Fill all fields");

        const btn = event.target;
        btn.innerText = "Uploading...";
        btn.disabled = true;

        const fd = new FormData();
        fd.append('file', file);
        fd.append('title', title);
        fd.append('year', year);

        try {
            const res = await fetch('/api/upload', { method: 'POST', body: fd });
            if(res.ok) {
                alert("✅ Success! The report is live.");
                location.reload();
            }
        } catch(e) { alert("Error uploading"); }
    }

    async function deleteReport(id) {
        if(!confirm("Delete this report?")) return;
        await fetch(`/api/delete/${id}`, { 
            method: 'DELETE',
            headers: { 'X-Admin-Key': 'Tandy254./' }
        });
        loadReports();
    }

    loadReports();
</script>
</body>
</html>
