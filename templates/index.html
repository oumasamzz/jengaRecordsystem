<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenga Africa - Reports</title>
    <style>
        :root {
            --primary: linear-gradient(135deg, #FF9966 0%, #CC66FF 100%);
            --bg: #121212;
            --card: #1e1e1e;
        }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        h1 { background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 3rem; }
        
        /* Admin Panel */
        .admin-panel { background: #1a1a1a; border: 1px dashed #444; padding: 20px; border-radius: 12px; margin-bottom: 40px; display: none; }
        .upload-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; text-align: center; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .icon { font-size: 3rem; margin-bottom: 10px; background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sec { background: #333; color: white; margin-right: 5px; }
        .btn-del { position: absolute; top: 10px; right: 10px; background: none; color: #ff4d4d; border: none; cursor: pointer; }
        
        #pdf-viewer { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; }
        iframe { width: 80%; height: 85%; margin: 2% auto; display: block; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Annual <span style="color:white">Reports</span></h1>
            <button class="btn btn-sec" onclick="document.getElementById('admin-panel').style.display='block'">Admin</button>
        </header>

        <div id="admin-panel" class="admin-panel">
            <h3>Upload Report</h3>
            <div class="upload-row">
                <input type="text" id="up-title" placeholder="Report Title">
                <input type="number" id="up-year" value="2026">
                <input type="file" id="up-file">
                <button class="btn btn-main" onclick="uploadFile()">Submit</button>
            </div>
        </div>

        <div class="grid" id="container"></div>
    </div>

    <div id="pdf-viewer">
        <button onclick="closePDF()" style="position:absolute; top:20px; right:40px; color:white; font-size:2rem; background:none; border:none; cursor:pointer;">&times;</button>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <script>
        const API_KEY = "Tandy254./";

        async function loadReports() {
            const res = await fetch('/api/reports');
            const data = await res.json();
            const cont = document.getElementById('container');
            cont.innerHTML = '';
            
            data.forEach(r => {
                const card = document.createElement('div');
                card.className = 'card';
                let icon = r.type === 'pdf' ? '📕' : (r.type?.includes('xl') ? '📗' : '📄');
                card.innerHTML = `
                    <button class="btn-del" onclick="deleteReport('${r.id}')">✕</button>
                    <div class="icon">${icon}</div>
                    <h3>${r.title}</h3>
                    <p style="color:#888">${r.year}</p>
                    <button class="btn btn-sec" onclick="openPDF('${r.url}')">View</button>
                    <a href="${r.url}" class="btn btn-main" download>Download</a>
                `;
                cont.appendChild(card);
            });
        }

        async function uploadFile() {
            const file = document.getElementById('up-file').files[0];
            const title = document.getElementById('up-title').value;
            const year = document.getElementById('up-year').value;
            if(!file || !title) return alert("Missing fields");

            const fd = new FormData();
            fd.append('file', file);
            fd.append('title', title);
            fd.append('year', year);

            const res = await fetch('/api/upload', { method: 'POST', body: fd });
            if(res.ok) { alert("Success!"); loadReports(); }
        }

        async function deleteReport(id) {
            if(!confirm("Delete?")) return;
            const res = await fetch(`/api/delete/${id}`, { 
                method: 'DELETE',
                headers: { 'X-Admin-Key': API_KEY }
            });
            if(res.ok) loadReports();
        }

        function openPDF(url) { 
            document.getElementById('pdf-frame').src = url; 
            document.getElementById('pdf-viewer').style.display='block'; 
        }
        function closePDF() { 
            document.getElementById('pdf-viewer').style.display='none'; 
            document.getElementById('pdf-frame').src = ''; 
        }

        loadReports();
    </script>
</body>
</html>
